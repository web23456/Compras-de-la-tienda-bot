<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Oro Real Primera Mano -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <linearGradient id="goldRadial" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2000" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0d0a00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <!-- Filtros de Brillo y Sombra de Lujo -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ffd700" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo Premium Redondeado -->
  <rect width="512" height="512" rx="110" fill="#000000" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="url(#bgGlow)" stroke="url(#goldLinear)" stroke-width="4" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Corona Real de Primera Mano -->
  <g filter="url(#goldGlow)" transform="translate(0, -10)">
    <path d="M 166 170 L 195 210 L 256 145 L 317 210 L 346 170 L 332 232 L 180 232 Z" fill="url(#goldLinear)" filter="url(#luxuryShadow)" />
    <!-- Gemas en las puntas de la corona -->
    <circle cx="166" cy="166" r="6" fill="#fff" />
    <circle cx="256" cy="140" r="8" fill="#fff" />
    <circle cx="346" cy="166" r="6" fill="#fff" />
    <!-- Base de la corona -->
    <rect x="178" y="228" width="156" height="7" rx="3.5" fill="#fcf6ba" />
  </g>

  <!-- Escudo Central / Letras K & A -->
  <!-- Letra K -->
  <path d="M 148 245 L 176 245 L 176 345 L 148 345 Z 
           M 176 295 L 218 245 L 248 245 L 196 304 L 252 345 L 220 345 L 176 312 Z" 
        fill="url(#goldLinear)" filter="url(#luxuryShadow)" />

  <!-- Símbolo '&' estilizado de lujo -->
  <text x="256" y="312" font-family="'Cinzel', 'Playfair Display', serif, system-ui" font-size="52" font-weight="900" text-anchor="middle" fill="#fcf6ba" filter="url(#goldGlow)">
    &amp;
  </text>

  <!-- Letra A -->
  <path d="M 314 245 L 342 245 L 378 345 L 349 345 L 340 318 L 298 318 L 290 345 L 262 345 Z
           M 328 274 L 305 300 L 335 300 Z" 
        fill="url(#goldLinear)" filter="url(#luxuryShadow)" />

  <!-- Divisor Ornamental de Oro -->
  <g transform="translate(0, 10)">
    <line x1="100" y1="365" x2="412" y2="365" stroke="url(#goldLinear)" stroke-width="2.5" />
    <polygon points="256,360 262,365 256,370 250,365" fill="#ffd700" filter="url(#goldGlow)" />
    <circle cx="100" cy="365" r="4" fill="url(#goldLinear)" />
    <circle cx="412" cy="365" r="4" fill="url(#goldLinear)" />
  </g>

  <!-- Subtítulo: PRIMERA MANO -->
  <text x="256" y="405" font-family="'Cinzel', 'Montserrat', 'Trajan Pro', sans-serif" font-size="28" font-weight="900" letter-spacing="9" text-anchor="middle" fill="url(#goldLinear)" filter="url(#luxuryShadow)">
    PRIMERA MANO
  </text>

  <!-- Placa / Insignia Inferior: GESTORES -->
  <g transform="translate(0, 10)">
    <rect x="156" y="420" width="200" height="34" rx="17" fill="#000000" stroke="url(#goldLinear)" stroke-width="2" filter="url(#luxuryShadow)" />
    <text x="256" y="443" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="4" text-anchor="middle" fill="#ffd700">
      ⚡ GESTORES ⚡
    </text>
  </g>
</svg>
